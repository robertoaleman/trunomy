[workspace]
members = [
    "abi",
    "boot",
    "bootcore",
    "kernel",
    "userland/shell",
    "userland/libtrunomy"
]
resolver = "2"

[profile.release]
opt-level = "z"       # Optimiza el tamaño del binario al máximo para mantenerlo mínimo
lto = true            # Habilita Link-Time Optimization para eliminar código muerto
panic = "abort"       # En Zero Trust, si hay un pánico abortamos inmediatamente el hilo

